name: Build Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Swap Space
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 15

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git-core gnupg flex bison build-essential zip curl zlib1g-dev \
            libc6-dev-i386 libncurses5 lib32ncurses5-dev x11proto-core-dev libx11-dev lib32z1-dev \
            libgl1-mesa-dev libxml2-utils xsltproc unzip fontconfig libssl-dev python3 python3-pip
          mkdir -p ~/.bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/.bin/repo
          chmod a+rx ~/.bin/repo

      - name: Sync Manifest
        run: |
          export PATH="${HOME}/.bin:${PATH}"
          mkdir -p android-kernel && cd android-kernel
          repo init -u https://android.googlesource.com/kernel/manifest -b common-android12-5.10-lts --depth=1
          repo sync -c -j$(nproc --all) --no-tags --no-clone-bundle

      - name: Build GKI Kernel
        run: |
          export PATH="${HOME}/.bin:${PATH}"
          cd android-kernel
          LTO=thin BUILD_CONFIG=common/build.config.gki.aarch64 build/build.sh

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-android12-5.10
          path: |
            android-kernel/out/android12-5.10/dist/Image*
