name: CI

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-kernel:
    name: Build Kernel
    runs-on: ubuntu-22.04
    steps:
      - name: Build
        uses: dabao1955/kernel_build_action@main
        with:
          kernel-url: https://github.com/prada101010/android_kernel_oppo_mt6765.git
          kernel-branch: main
          config: CPH2269_defconfig
          arch: arm64
          aosp-gcc: true
          aosp-clang: true
          android-version: 12
          aosp-clang-version: r383902
          release: true
          access-token: ${{ secrets.GITHUB_TOKEN }}